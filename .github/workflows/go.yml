name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  GO_VERSION: '1.25'
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/yasu

jobs:
  # ──────────────────────────────────────────
  # JOB 1 — Code Quality
  # ──────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check formatting
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            echo "These files are not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall 
          args: --out-format=colored-line-number  # ← not github-actions

  # ──────────────────────────────────────────
  # JOB 2 — Build & Test
  # ──────────────────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: lint   # only run if lint passes

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true   # cache go modules

      - name: Install docker-compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      # - name: Download GeoIP databases
      #   run: make geoip MAXMIND_KEY=${{ secrets.MAXMIND_KEY }}

      # - name: Start services
      #   run: make up

      # - name: Wait for Postgres to be ready
      #   run: |
      #     until docker-compose -f build/compose/services.yaml exec -T postgres pg_isready -U postgres; do
      #       echo "waiting for postgres..."
      #       sleep 2
      #     done

      # - name: Wait for ClickHouse to be ready
      #   run: |
      #     until docker-compose -f build/compose/services.yaml exec -T clickhouse clickhouse-client --query "SELECT 1"; do
      #       echo "waiting for clickhouse..."
      #       sleep 2
      #     done

      - name: Build binary
        run: go build -ldflags="-s -w" -o yasu ./cmd/urlshort/main.go

      - name: Run tests
        run: go test -v -race -count=1 ./...

      - name: Tear down
        if: always()
        run: make down

  # ──────────────────────────────────────────
  # JOB 3 — Publish Image (main branch only)
  # ──────────────────────────────────────────
  publish:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test   # only publish if tests pass
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Download GeoIP databases
        run: make geoip MAXMIND_KEY=${{ secrets.MAXMIND_KEY }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          file: build/images/Dockerfile

      - name: Print image digest
        run: echo "Published ${{ env.IMAGE_NAME }} — ${{ steps.meta.outputs.tags }}"