networks:
  urlshort-network:
    driver: bridge

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: urlshort
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d urlshort"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - urlshort-network

  # clickhouse:
  #   image: clickhouse/clickhouse-server:latest
  #   ports:
  #     - "9000:9000"   # native protocol (use this in Go)
  #     - "8123:8123"   # HTTP interface (useful for debugging in browser)
  #   networks:
  #     - urlshort-network

  # redis:
  #   image: redis:7
  #   ports:
  #     - "6379:6379"
  #   networks:
  #     - urlshort-network

  urlshort:
    extends:
      file: ../images/build.yaml
      service: urlshort
    networks:
      - urlshort-network
    depends_on:
      postgres:
        condition: service_healthy