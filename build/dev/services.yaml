version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: urlshort
    ports:
      - "5432:5432"

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "9000:9000"   # native protocol (use this in Go)
      - "8123:8123"   # HTTP interface (useful for debugging in browser)

  redis:
    image: redis:7
    ports:
      - "6379:6379"